services:
  nas-local-music-player:
    image: node:22-slim  # 使用官方镜像，避免构建
    container_name: nas-local-music-player
    restart: unless-stopped
    ports:
      - "9524:9524"
    volumes:
      - "/vol2/1000/web/nas-local-music-player:/app"
      - "/dev/snd:/dev/snd"
      - "/vol6/@team/影视音1/音乐:/app/music"
    working_dir: "/app"
    environment:
      - NODE_ENV=production
      - PORT=9524
      - IS_DOCKER=true
      - ALSA_ENABLED=true
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    devices:
      - "/dev/snd:/dev/snd"
    group_add:
      - audio
    privileged: true
    command: >
      sh -c "
        apt-get update && apt-get install -y alsa-utils ffmpeg &&
        npm install --production &&
        node server.js
      "